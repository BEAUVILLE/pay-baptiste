<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#06140f">
<title>DIGIY PAY Baptiste — ABOS Ready</title>
<style>
:root{--bg:#06140f;--panel:#0b2118;--card:#fff7df;--ink:#172016;--muted:#6b5a3b;--line:rgba(255,255,255,.12);--gold:#f4d27a;--green:#22c55e;--red:#9a3412;--max:1040px}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at top left,rgba(244,210,122,.15),transparent 34%),linear-gradient(180deg,var(--bg),#020806);color:#fff8e8;font-weight:850}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{width:min(var(--max),100%);margin:0 auto;padding:18px 18px 110px}.top{position:sticky;top:0;z-index:5;background:rgba(6,20,15,.96);border:1px solid var(--line);border-radius:28px;padding:16px;box-shadow:0 18px 44px rgba(0,0,0,.26);backdrop-filter:blur(14px)}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}.round{min-height:46px;border-radius:16px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.08);color:#fff;font-weight:1000;padding:0 14px;text-decoration:none;display:inline-flex;align-items:center}.title{text-align:center}.title small{display:block;color:rgba(255,255,255,.62);font-size:12px;letter-spacing:.14em;text-transform:uppercase}.title b{display:block;color:var(--gold);font-size:28px;line-height:1}.hero{margin-top:14px;border-radius:24px;background:linear-gradient(135deg,#fff7df,#ead29a);color:#142016;padding:18px}.hero small{display:block;color:#5d4a22;text-transform:uppercase;letter-spacing:.08em;font-size:12px}.hero strong{display:block;font-size:44px;letter-spacing:-.04em;line-height:1}.hero p{margin:8px 0 0;color:#4d3e1e}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.metric{border-radius:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.10);padding:14px}.metric small{display:block;color:rgba(255,255,255,.62);font-size:12px;text-transform:uppercase}.metric strong{display:block;font-size:24px;color:#fff}.grid{display:grid;grid-template-columns:380px 1fr;gap:14px;margin-top:14px}.panel{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);border-radius:24px;padding:16px}.panel h2{margin:0 0 12px;color:#fff;font-size:24px}.notice{padding:13px;border-radius:18px;background:rgba(244,210,122,.12);border:1px solid rgba(244,210,122,.22);color:#fff4c8;font-size:15px;line-height:1.45;margin-bottom:12px}.field{margin-bottom:12px}.field label{display:block;margin-bottom:6px;color:#f4d27a;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:1000}.field input,.field select,.field textarea{width:100%;min-height:54px;border-radius:16px;border:1px solid rgba(255,255,255,.18);background:#fff;color:#172016;padding:12px;font-weight:950;outline:none}.field textarea{min-height:88px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.save{width:100%;min-height:54px;border:0;border-radius:18px;background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;font-weight:1100}.soft{min-height:46px;border-radius:16px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.10);color:#fff;font-weight:1000;padding:10px 12px}.search{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px}.search input{min-height:50px;border-radius:16px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#fff;padding:12px;font-weight:1000}.list{display:grid;gap:10px}.row{background:linear-gradient(160deg,#fffaf0,#f1dfb8);color:var(--ink);border-radius:22px;padding:16px;border:1px solid rgba(78,56,25,.14)}.row-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.name{font-size:23px;font-weight:1100;line-height:1.05}.meta{margin-top:6px;color:#695738;font-size:15px;font-weight:950;line-height:1.4}.badge{white-space:nowrap;border-radius:999px;padding:7px 10px;background:#dcfce7;color:#14532d;font-size:12px;font-weight:1100}.badge.wait{background:#ffedd5;color:#9a3412}.badge.stop{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.small{min-height:40px;border-radius:13px;border:1px solid rgba(78,56,25,.18);background:#fff;color:#172016;padding:8px 11px;font-size:14px;font-weight:1100;text-decoration:none;display:inline-flex;align-items:center}.small.plus{background:#dcfce7;color:#14532d}.small.warn{background:#ffedd5;color:#9a3412}.small.danger{background:#fff7ed;color:#9a3412}.empty{padding:22px;text-align:center;border:1px dashed rgba(255,255,255,.18);border-radius:20px;color:rgba(255,255,255,.72)}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(2,8,6,0),rgba(2,8,6,.96) 35%)}.bottom-inner{width:min(var(--max),100%);margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:rgba(7,21,15,.94);border:1px solid rgba(255,255,255,.10);border-radius:22px;padding:8px}.bottom a,.bottom button{min-height:56px;border-radius:16px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.06);color:#fff;font-weight:1100;text-decoration:none;display:grid;place-items:center}.bottom .main{background:linear-gradient(135deg,#22c55e,#bbf7d0);color:#052215;border:none}.status{display:none;margin-top:10px;padding:12px;border-radius:16px;font-size:14px;font-weight:1000}.status.ok{display:block;background:#dcfce7;color:#14532d}.status.err{display:block;background:#ffedd5;color:#9a3412}@media(max-width:760px){:root{--max:560px}.app{padding:0 0 108px}.top{border-radius:0;border-left:0;border-right:0}.title b{font-size:22px}.hero strong{font-size:34px}.grid{grid-template-columns:1fr;padding:0 12px}.metrics{grid-template-columns:repeat(3,1fr)}.metric{padding:11px 8px}.metric strong{font-size:19px}.panel h2{font-size:21px}.row{padding:14px}.name{font-size:20px}.meta{font-size:14px}.two{grid-template-columns:1fr}.round{font-size:13px;padding:0 10px}.bottom-inner{grid-template-columns:repeat(4,1fr);gap:6px}.bottom a,.bottom button{font-size:12px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="bar"><a class="round" href="./index.html?v=retour-pay">‹ PAY</a><div class="title"><small>DIGIY PAY</small><b>ABOS Ready</b></div><button class="round" id="btnExport" type="button">💾 Export</button></div><div class="hero"><small>Total ABOS du mois</small><strong id="monthTotal">0 F</strong><p>Wave reçoit. SMS confirme. PAY trace. Baptiste décide.</p></div><div class="metrics"><div class="metric"><small>Abonnés</small><strong id="mAll">0</strong></div><div class="metric"><small>Actifs</small><strong id="mActive">0</strong></div><div class="metric"><small>À relancer</small><strong id="mWait">0</strong></div></div></header>
<div class="grid">
<section class="panel"><h2 id="formTitle">Ajouter un abonné</h2><div class="notice">Au début tu entres nom + téléphone. Ensuite tu cliques Encaisser quand Wave ou SMS confirme.</div><form id="subForm"><input id="subId" type="hidden"><div class="field"><label>Nom</label><input id="subName" required placeholder="Nom abonné"></div><div class="field"><label>Téléphone</label><input id="subPhone" required type="tel" placeholder="+221…"></div><div class="two"><div class="field"><label>Module</label><select id="subModule"><option>ABOS</option><option>BUILD</option><option>LOC</option><option>DRIVER</option><option>MARKET</option><option>POS</option><option>RESA</option><option>EXPLORE</option><option>JOBS</option><option>RÉSEAU</option><option>NDIMBAL</option></select></div><div class="field"><label>Statut</label><select id="subStatus"><option value="active">Actif</option><option value="wait">À relancer</option><option value="stop">Suspendu</option></select></div></div><div class="two"><div class="field"><label>Formule</label><select id="subPlan"><option>Mensuel</option><option>3 mois</option><option>Annuel</option><option>FIRST</option><option>Libre</option></select></div><div class="field"><label>Échéance</label><input id="subDue" type="date"></div></div><div class="field"><label>Note</label><textarea id="subNote" placeholder="Fiche, rappel, besoin…"></textarea></div><button class="save" type="submit">Garder l’abonné</button><button class="soft" id="btnCancelEdit" type="button" style="display:none;margin-top:8px;width:100%">Annuler modification</button></form><hr style="border:0;border-top:1px solid rgba(255,255,255,.12);margin:16px 0"><h2>Encaisser</h2><form id="payForm"><div class="field"><label>Abonné</label><select id="paySub"></select></div><div class="two"><div class="field"><label>Montant</label><input id="payAmount" type="number" inputmode="numeric" min="0" step="1" placeholder="Montant"></div><div class="field"><label>Preuve</label><select id="payProof"><option>Wave reçu</option><option>SMS reçu</option><option>Note manuelle</option></select></div></div><button class="save" type="submit">Tracer dans la caisse</button><div id="payStatus" class="status"></div></form></section>
<section class="panel"><h2>Répertoire ABOS</h2><div class="search"><input id="search" placeholder="Rechercher nom, téléphone, module…"><button class="soft" id="clear" type="button">×</button></div><div class="list" id="list"></div></section>
</div>
</div>
<nav class="bottom"><div class="bottom-inner"><a href="./index.html?v=abos-retour">🏦 PAY</a><button id="navAdd" class="main" type="button">＋ Abonné</button><button id="navPay" type="button">💸 Encaisser</button><button id="navExport" type="button">💾 Export</button></div></nav>
<script>
(function(){
'use strict';
const SESSION_KEY='digiy_pay_baptiste_validated_at',SESSION_MS=8*60*60*1000;
const ts=Number(localStorage.getItem(SESSION_KEY)||0);if(!(ts&&Number.isFinite(ts)&&Date.now()-ts<SESSION_MS)){location.replace('./pin.html?next=abos-ready.html');return;}
const KEY='digiy_pay_baptiste_reel_v2';
let state=norm(load());
const $=id=>document.getElementById(id);
function base(){return{settings:{pocket:'pro',eyeOpen:true,visibleCount:10},activities:[{id:'abos',pocket:'pro',name:'ABOS'}],labels:['Abonnement'],people:[],subscribers:[],movements:[]}}
function load(){try{return Object.assign(base(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return base()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function norm(s){s=Object.assign(base(),s||{});s.subscribers=Array.isArray(s.subscribers)?s.subscribers:[];s.movements=Array.isArray(s.movements)?s.movements:[];s.activities=Array.isArray(s.activities)?s.activities:base().activities;if(!s.activities.some(a=>a.name==='ABOS'))s.activities.unshift({id:'abos',pocket:'pro',name:'ABOS'});s.labels=Array.isArray(s.labels)?s.labels:[];if(!s.labels.includes('Abonnement'))s.labels.push('Abonnement');s.people=Array.isArray(s.people)?s.people:[];return s}
function uid(p){return p+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4)}
function esc(v){return String(v||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function fmt(n){return Math.round(Number(n||0)).toLocaleString('fr-FR').replace(/\u202f/g,' ')+' F'}
function phone(v){let p=String(v||'').replace(/[^0-9+]/g,'');if(p.startsWith('00'))p='+'+p.slice(2);return p}
function wa(v){return phone(v).replace(/^\+/,'')}
function today(){return new Date().toISOString().slice(0,10)}
function monthTotal(){const ym=today().slice(0,7);return state.movements.filter(m=>m.activity==='ABOS'&&m.label==='Abonnement'&&String(m.ts||'').slice(0,7)===ym).reduce((s,m)=>s+Number(m.amount||0),0)}
function badge(s){if(s.status==='wait')return '<span class="badge wait">À relancer</span>';if(s.status==='stop')return '<span class="badge stop">Suspendu</span>';return '<span class="badge">Actif</span>'}
function render(){save();$('monthTotal').textContent=fmt(monthTotal());$('mAll').textContent=state.subscribers.length;$('mActive').textContent=state.subscribers.filter(s=>s.status==='active').length;$('mWait').textContent=state.subscribers.filter(s=>s.status==='wait').length;renderPaySelect();renderList()}
function renderPaySelect(){const opts=state.subscribers.map(s=>`<option value="${esc(s.id)}">${esc(s.name)} — ${esc(s.module||'ABOS')}</option>`).join('');$('paySub').innerHTML=opts||'<option value="">Aucun abonné</option>'}
function filtered(){const q=String($('search').value||'').toLowerCase().trim();let a=state.subscribers.slice().sort((x,y)=>String(x.name).localeCompare(String(y.name)));if(q)a=a.filter(s=>[s.name,s.phone,s.module,s.status,s.plan,s.due,s.note].join(' ').toLowerCase().includes(q));return a}
function renderList(){const arr=filtered();if(!arr.length){$('list').innerHTML='<div class="empty">Aucun abonné. Ajoute le premier test ici.</div>';return}$('list').innerHTML=arr.map(s=>{const p=phone(s.phone),linked=state.movements.filter(m=>m.activity==='ABOS'&&m.label==='Abonnement'&&(m.abosSubscriberId===s.id||m.person===s.name)).reduce((a,m)=>a+Number(m.amount||0),0);return `<article class="row"><div class="row-top"><div><div class="name">${esc(s.name)}</div><div class="meta">${esc(s.phone)} · ${esc(s.module||'ABOS')} · ${esc(s.plan||'Mensuel')} ${s.due?'· échéance '+esc(s.due):''}<br>Total encaissé : ${fmt(linked)}${s.note?'<br>'+esc(s.note):''}</div></div>${badge(s)}</div><div class="actions"><button class="small plus" data-pay="${esc(s.id)}">Encaisser</button><a class="small" href="tel:${esc(p)}">Appel</a><a class="small" href="sms:${esc(p)}">SMS</a><a class="small" href="https://wa.me/${esc(wa(s.phone))}" target="_blank" rel="noopener">WhatsApp</a><button class="small warn" data-wait="${esc(s.id)}">Relancer</button><button class="small" data-edit="${esc(s.id)}">Modifier</button><button class="small danger" data-del="${esc(s.id)}">Supprimer</button></div></article>`}).join('')}
function resetForm(){$('subForm').reset();$('subId').value='';$('formTitle').textContent='Ajouter un abonné';$('btnCancelEdit').style.display='none'}
function editSub(s){$('subId').value=s.id;$('formTitle').textContent='Modifier abonné';$('subName').value=s.name||'';$('subPhone').value=s.phone||'';$('subModule').value=s.module||'ABOS';$('subStatus').value=s.status||'active';$('subPlan').value=s.plan||'Mensuel';$('subDue').value=s.due||'';$('subNote').value=s.note||'';$('btnCancelEdit').style.display='block';scrollTo({top:0,behavior:'smooth'})}
$('subForm').onsubmit=e=>{e.preventDefault();const id=$('subId').value||uid('s');const s={id,name:$('subName').value.trim(),phone:$('subPhone').value.trim(),module:$('subModule').value,status:$('subStatus').value,plan:$('subPlan').value,due:$('subDue').value,note:$('subNote').value.trim(),ts:($('subId').value?(state.subscribers.find(x=>x.id===id)?.ts||new Date().toISOString()):new Date().toISOString()),updatedAt:$('subId').value?new Date().toISOString():''};const i=state.subscribers.findIndex(x=>x.id===id);if(i>=0)state.subscribers[i]=s;else state.subscribers.push(s);resetForm();render()};
$('payForm').onsubmit=e=>{e.preventDefault();const id=$('paySub').value,s=state.subscribers.find(x=>x.id===id),amount=Math.round(Number($('payAmount').value||0));if(!s)return alert('Choisis un abonné.');if(amount<=0)return alert('Pose un montant propre.');state.movements.push({id:uid('m'),pocket:'pro',type:'income',mode:'Wave',amount,label:'Abonnement',activity:'ABOS',person:s.name,note:$('payProof').value,abosSubscriberId:s.id,ts:new Date().toISOString()});if(!state.people.includes(s.name))state.people.push(s.name);s.status='active';$('payAmount').value='';$('payStatus').className='status ok';$('payStatus').textContent='Paiement ABOS tracé dans la caisse.';render()};
$('list').onclick=e=>{const pay=e.target.closest('[data-pay]'),edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-del]'),wait=e.target.closest('[data-wait]');if(pay){$('paySub').value=pay.getAttribute('data-pay');$('payAmount').focus();scrollTo({top:0,behavior:'smooth'})}if(edit){const s=state.subscribers.find(x=>x.id===edit.getAttribute('data-edit'));if(s)editSub(s)}if(wait){const s=state.subscribers.find(x=>x.id===wait.getAttribute('data-wait'));if(s){s.status='wait';render()}}if(del){const id=del.getAttribute('data-del'),s=state.subscribers.find(x=>x.id===id);if(s&&confirm('Supprimer cet abonné ?')){const linked=state.movements.filter(m=>m.activity==='ABOS'&&m.label==='Abonnement'&&(m.abosSubscriberId===id||m.person===s.name));if(linked.length&&confirm('Supprimer aussi les paiements ABOS liés de la caisse ? Pour un test clique OK. Pour un vrai abonné, Annuler garde la trace.')){state.movements=state.movements.filter(m=>!(m.activity==='ABOS'&&m.label==='Abonnement'&&(m.abosSubscriberId===id||m.person===s.name)))}state.subscribers=state.subscribers.filter(x=>x.id!==id);render()}}};
function exportJson(){const data=JSON.stringify({app:'DIGIY_PAY_BAPTISTE_ABOS',exported_at:new Date().toISOString(),data:state},null,2);const blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='digiy-pay-baptiste-abos-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}
$('search').oninput=renderList;$('clear').onclick=()=>{$('search').value='';renderList()};$('btnCancelEdit').onclick=resetForm;$('btnExport').onclick=exportJson;$('navExport').onclick=exportJson;$('navAdd').onclick=()=>{resetForm();$('subName').focus();scrollTo({top:0,behavior:'smooth'})};$('navPay').onclick=()=>{$('payAmount').focus();scrollTo({top:0,behavior:'smooth'})};
render();
})();
</script>
</body>
</html>
