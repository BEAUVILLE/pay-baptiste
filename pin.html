<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>DIGIY PAY Baptiste — PIN</title>
  <meta name="theme-color" content="#04110d">
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root{--bg:#04110d;--card:#0b1f18;--line:rgba(255,255,255,.12);--text:#f3fff7;--muted:rgba(243,255,247,.72);--green:#22c55e;--green2:#16a34a;--gold:#facc15;--danger:#f87171;--max:520px}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}body{min-height:100vh;display:grid;place-items:center;padding:16px;background:radial-gradient(circle at top left,rgba(34,197,94,.16),transparent 34%),radial-gradient(circle at bottom right,rgba(250,204,21,.10),transparent 30%),linear-gradient(180deg,var(--bg),#061710 58%,#03100b);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-weight:850}.shell{width:min(var(--max),100%)}.card{background:linear-gradient(180deg,rgba(11,31,24,.98),rgba(7,24,17,.98));border:1px solid var(--line);border-radius:28px;box-shadow:0 22px 60px rgba(0,0,0,.34);overflow:hidden}.top{padding:24px 18px 14px;text-align:center}.mark{width:68px;height:68px;margin:0 auto 12px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),#fff3c4);color:#052215;font-size:32px;font-weight:1000}h1{margin:0;color:var(--gold);font-size:29px;line-height:1.08;font-weight:1000;letter-spacing:-.03em}.sub{margin:9px auto 0;max-width:36ch;color:var(--muted);font-size:14px;line-height:1.55}.session{margin:14px 18px 0;padding:13px 14px;border:1px solid rgba(250,204,21,.22);border-radius:18px;background:rgba(250,204,21,.08);color:#fef3c7;font-size:13px;line-height:1.55;font-weight:900;text-align:center}.panel{margin:16px 18px 18px;padding:16px;border-radius:22px;border:1px solid var(--line);background:rgba(255,255,255,.035)}.label{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;color:#bbf7d0;font-size:12px;font-weight:1000;letter-spacing:.08em;text-transform:uppercase}.dots{min-height:58px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:11px;border-radius:18px;border:1px solid rgba(255,255,255,.10);background:rgba(0,0,0,.16)}.dot{width:15px;height:15px;border-radius:999px;border:2px solid rgba(243,255,247,.36);background:transparent}.dot.on{border-color:var(--gold);background:var(--gold);box-shadow:0 0 0 5px rgba(250,204,21,.10)}.pin-input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}.keypad{margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.key{min-height:58px;border-radius:18px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.055);color:var(--text);font-size:22px;font-weight:1000;cursor:pointer}.key.soft{color:#fef3c7;font-size:14px}.btn{width:100%;min-height:54px;margin-top:14px;border-radius:999px;border:none;background:linear-gradient(135deg,var(--green),var(--green2));color:#052215;font-size:15px;font-weight:1000;cursor:pointer}.btn:disabled{opacity:.48;cursor:not-allowed}.msg{display:none;margin-top:12px;padding:12px 13px;border-radius:16px;font-size:13px;line-height:1.45;font-weight:950;text-align:center}.msg.ok{display:block;border:1px solid rgba(34,197,94,.24);background:rgba(34,197,94,.10);color:#bbf7d0}.msg.err{display:block;border:1px solid rgba(248,113,113,.25);background:rgba(248,113,113,.10);color:#fecaca}.foot{padding:0 18px 20px;color:rgba(243,255,247,.58);font-size:12px;line-height:1.6;font-weight:800;text-align:center}@media(max-width:420px){body{padding:10px}h1{font-size:26px}.key{min-height:56px}.panel,.session{margin-left:12px;margin-right:12px}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="card">
      <div class="top"><div class="mark">₣</div><h1>DIGIY PAY<br>Baptiste</h1><div class="sub">Coffre personnel. PIN obligatoire avant d’ouvrir le cockpit PRO / PERSO.</div></div>
      <div class="session">Session protégée pendant <b>8 heures</b>. Après ce délai, le PIN est redemandé.</div>
      <div class="panel">
        <div class="label"><span>Entrer le PIN</span><span id="attemptText">Coffre fermé</span></div>
        <input id="pinInput" class="pin-input" type="password" inputmode="numeric" autocomplete="one-time-code" maxlength="8" aria-label="PIN DIGIY PAY Baptiste">
        <button class="dots" id="focusDots" type="button" aria-label="Saisir le PIN"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></button>
        <div class="keypad">
          <button class="key" type="button" data-num="1">1</button><button class="key" type="button" data-num="2">2</button><button class="key" type="button" data-num="3">3</button>
          <button class="key" type="button" data-num="4">4</button><button class="key" type="button" data-num="5">5</button><button class="key" type="button" data-num="6">6</button>
          <button class="key" type="button" data-num="7">7</button><button class="key" type="button" data-num="8">8</button><button class="key" type="button" data-num="9">9</button>
          <button class="key soft" type="button" id="clearBtn">Effacer</button><button class="key" type="button" data-num="0">0</button><button class="key soft" type="button" id="backBtn">⌫</button>
        </div>
        <button id="openBtn" class="btn" type="button" disabled>🔐 Ouvrir mon argent</button>
        <div id="msg" class="msg" aria-live="polite"></div>
      </div>
      <div class="foot">DIGIY PAY Baptiste · PRO / PERSO · le patron voit, retrouve, décide.</div>
    </section>
  </main>
<script>
(function(){
  'use strict';
  const SUPABASE_URL='https://wesqmwjjtsefyjnluosj.supabase.co';
  const SUPABASE_ANON_KEY='sb_publishable_tGHItRgeWDmGjnd0CK1DVQ_BIep4Ug3';
  const CONFIG={REDIRECT_AFTER_OK:'./index.html',SESSION_KEY:'digiy_pay_baptiste_validated_at',SESSION_HOURS:8,MAX_ATTEMPTS:5,LOCK_SECONDS:30,LOCK_KEY:'digiy_pay_baptiste_pin_lock_until',ATTEMPTS_KEY:'digiy_pay_baptiste_pin_attempts'};
  const SESSION_MS=CONFIG.SESSION_HOURS*60*60*1000;
  const PHONE='221771342889';
  const MODULE='PAY';
  const pinInput=document.getElementById('pinInput'),openBtn=document.getElementById('openBtn'),msg=document.getElementById('msg'),focusDots=document.getElementById('focusDots'),attemptText=document.getElementById('attemptText'),clearBtn=document.getElementById('clearBtn'),backBtn=document.getElementById('backBtn'),dotEls=Array.from(document.querySelectorAll('.dot'));
  function now(){return Date.now()}
  function digits(v){return String(v||'').replace(/\D/g,'').slice(0,8)}
  function num(k){const n=Number(localStorage.getItem(k)||'0');return Number.isFinite(n)?n:0}
  function valid(){const ts=num(CONFIG.SESSION_KEY);return ts>0&&(now()-ts)<SESSION_MS}
  function locked(){const u=num(CONFIG.LOCK_KEY);return u>now()?u:0}
  function msgSet(t,x){msg.className='msg '+(t||'');msg.textContent=x||'';msg.style.display=x?'block':'none'}
  function redirect(){window.location.replace(CONFIG.REDIRECT_AFTER_OK)}
  function update(){const v=digits(pinInput.value);pinInput.value=v;dotEls.forEach((d,i)=>d.classList.toggle('on',i<Math.min(v.length,4)));const l=locked();openBtn.disabled=v.length<4||!!l;attemptText.textContent=l?('Pause '+Math.ceil((l-now())/1000)+' s'):(num(CONFIG.ATTEMPTS_KEY)?('Essai '+num(CONFIG.ATTEMPTS_KEY)+'/'+CONFIG.MAX_ATTEMPTS):'Coffre fermé')}
  function add(n){if(locked()){update();msgSet('err','Patiente quelques secondes.');return}pinInput.value=digits(pinInput.value)+String(n);msgSet('','');update()}
  function back(){pinInput.value=digits(pinInput.value).slice(0,-1);msgSet('','');update()}
  function clear(){pinInput.value='';msgSet('','');update();pinInput.focus()}
  function fail(){const a=num(CONFIG.ATTEMPTS_KEY)+1;localStorage.setItem(CONFIG.ATTEMPTS_KEY,String(a));if(a>=CONFIG.MAX_ATTEMPTS){localStorage.setItem(CONFIG.LOCK_KEY,String(now()+CONFIG.LOCK_SECONDS*1000));localStorage.setItem(CONFIG.ATTEMPTS_KEY,'0');msgSet('err',"Trop d'essais. Pause "+CONFIG.LOCK_SECONDS+" secondes.")}else msgSet('err',"PIN incorrect. Vérifie puis recommence.");pinInput.value='';update()}
  async function openVault(){
    if(locked()){update();return}
    const p=digits(pinInput.value);
    if(p.length<4){msgSet('err','Entre ton PIN.');return}
    openBtn.disabled=true;openBtn.textContent='Vérification…';
    try{
      const res=await fetch(SUPABASE_URL+'/rest/v1/rpc/digiy_verify_pin',{
        method:'POST',
        headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY},
        body:JSON.stringify({p_phone:PHONE,p_module:MODULE,p_pin:p})
      });
      const data=await res.json();
      if(Array.isArray(data)&&data[0]&&data[0].ok===true){
        localStorage.setItem(CONFIG.SESSION_KEY,String(now()));
        localStorage.setItem(CONFIG.ATTEMPTS_KEY,'0');
        localStorage.removeItem(CONFIG.LOCK_KEY);
        msgSet('ok','PIN validé. Ouverture…');
        openBtn.textContent='✅ Coffre ouvert';
        setTimeout(redirect,350);
        return;
      }
      fail();
    }catch(e){msgSet('err','Connexion impossible. Vérifie ta connexion.')}
    finally{if(!valid()){openBtn.textContent='🔐 Ouvrir mon argent';update()}}
  }
  document.querySelectorAll('[data-num]').forEach(b=>b.addEventListener('click',()=>add(b.getAttribute('data-num'))));
  clearBtn.onclick=clear;backBtn.onclick=back;openBtn.onclick=openVault;focusDots.onclick=()=>pinInput.focus();pinInput.oninput=update;
  document.addEventListener('keydown',e=>{if(/^\d$/.test(e.key))add(e.key);else if(e.key==='Backspace')back();else if(e.key==='Enter')openVault()});
  setInterval(update,500);
  if(valid()){msgSet('ok','Session encore active. Ouverture…');setTimeout(redirect,250)}else{update();setTimeout(()=>pinInput.focus(),250)}
})();
</script>
</body>
</html>
